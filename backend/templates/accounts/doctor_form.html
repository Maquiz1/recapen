{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="app-body">

            <!-- Row starts -->
            <div class="row gx-3">
              <div class="col-xl-12">
                <div class="card">
                  <div class="card-body">

                    <form method="post" enctype="multipart/form-data">
                      {% csrf_token %}
                      <div class="row gx-3">
                        {% for field in form %}
                        <div class="col-xxl-4 col-lg-4 col-sm-6">
                          <div class="mb-3">
                            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }} {% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
                            {{ field }}
                            {% if field.help_text %}
                            <div class="form-text">{{ field.help_text }}</div>
                            {% endif %}
                            {% for error in field.errors %}
                            <div class="text-danger mt-1">{{ error }}</div>
                            {% endfor %}
                          </div>
                        </div>
                        {% endfor %}
                      </div>
                      
                      <!-- Card actions starts -->
                      <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{% url 'accounts:doctors_grid' %}" class="btn btn-outline-secondary">
                          Cancel
                        </a>
                        <button type="submit" class="btn btn-primary">
                          Save Doctor
                        </button>
                      </div>
                      <!-- Card actions ends -->
                    </form>

                  </div>
                </div>
              </div>
            </div>
            <!-- Row ends -->

          </div>
{% endblock content %}

{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password - Hospital Admin</title>
    <link rel="shortcut icon" href="{% static 'assets/images/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'assets/fonts/remix/remixicon.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/main.min.css' %}">
</head>
<body class="login-bg">
    <div class="container">
      <div class="auth-wrapper">
        <form method="post" action="">
          {% csrf_token %}
          <div class="auth-box">
            <div class="auth-logo mb-4 d-flex justify-content-center">
              <a href="{% url 'login' %}" class="d-flex align-items-center text-decoration-none">
                <div class="d-flex align-items-center justify-content-center bg-primary text-white rounded" style="width: 35px; height: 35px; font-weight: bold; font-size: 20px;">
                  R
                </div>
                <h4 class="mb-0 ms-2 text-primary" style="font-weight: 700; letter-spacing: 1px; line-height: 1;">RECAPEN</h4>
              </a>
            </div>

            <h6 class="fw-light mb-4">In order to access your dashboard, please enter the email ID you provided during the registration process.</h6>

            {% if form.errors %}
              <div class="alert alert-danger p-2 mb-3">
                <small>Please correct the errors below.</small>
                {{ form.email.errors }}
              </div>
            {% endif %}

            <div class="mb-3">
              <label class="form-label" for="id_email">Your email <span class="text-danger">*</span></label>
              <input type="email" name="email" id="id_email" class="form-control" placeholder="Enter your email" required autofocus>
            </div>

            <div class="mb-3 d-grid">
              <button type="submit" class="btn btn-primary">Submit</button>
            </div>
            
            <div class="text-center mt-3">
                <a href="{% url 'login' %}" class="text-decoration-underline">Back to Login</a>
            </div>
          </div>
        </form>
      </div>
    </div>
</body>
</html>

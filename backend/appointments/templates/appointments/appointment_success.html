{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- App body starts -->
<div class="app-body">
  <div class="container-fluid">
    <div class="row gx-3">
      <div class="col-sm-12">
        <div class="card">
          <div class="card-body">
            <div class="text-center py-5">
              <i class="ri-checkbox-circle-line text-success" style="font-size: 5rem;"></i>
              <h3 class="mt-4 mb-3">Appointment Booked Successfully!</h3>
              <p class="text-muted mb-4">The appointment has been successfully scheduled and added to the calendar.</p>
              <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'appointments:dashboard' %}" class="btn btn-primary">Go to Dashboard</a>
                <a href="{% url 'appointments:book' %}" class="btn btn-outline-primary">Book Another</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- App body ends -->
{% endblock %}
